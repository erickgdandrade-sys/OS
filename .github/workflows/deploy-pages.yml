# Compila o app (Vite) e publica no GitHub Pages a cada push na main.
# Em Settings → Pages, escolha "Source: GitHub Actions".
# A URL e a anon key do Supabase ficam em .env.production (são públicas por definição).
# Nunca coloque a service role aqui.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        # URL e anon key vêm de .env.production. Para trocar de projeto sem editar o arquivo,
        # crie as variáveis do repositório VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY.
        run: |
          [ -n "${{ vars.VITE_SUPABASE_URL }}" ] && export VITE_SUPABASE_URL="${{ vars.VITE_SUPABASE_URL }}"
          [ -n "${{ vars.VITE_SUPABASE_ANON_KEY }}" ] && export VITE_SUPABASE_ANON_KEY="${{ vars.VITE_SUPABASE_ANON_KEY }}"
          npm run build
      # Site institucional: publicado em /<repositório>/site/, lê o conteúdo do Supabase.
      - name: Site institucional
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/build-site.mjs
      # SPA: o Pages devolve 404.html para rotas como /SISTEMA-TESTE/projetos/…; o app assume a partir dali.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
